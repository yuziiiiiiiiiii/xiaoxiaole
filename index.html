<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7ecdf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>开心消消乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23224a7a'/%3E%3Ccircle cx='50' cy='56' r='30' fill='%23ffd43b'/%3E%3Ccircle cx='40' cy='50' r='5' fill='%234a3315'/%3E%3Ccircle cx='60' cy='50' r='5' fill='%234a3315'/%3E%3Cpath d='M44 62q6 8 12 0' stroke='%23e2731a' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --sky-1:#57beee;
    --sky-2:#a8e5fd;
    --sky-3:#eafcff;
    --cream:#fff8e4;
    --wood:#f3c987;
    --wood-dark:#b97b3c;
    --ink:#5a3a1c;
    --gold:#ffd23f;
    --font:"Yuanti SC","Hiragino Sans GB","PingFang SC","Microsoft YaHei",sans-serif;
    --num:"Arial Rounded MT Bold","Yuanti SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font);
    background:#dff3ff;
    color:#fff;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;
  }
  .app{
    position:relative;
    width:100%;
    max-width:520px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg,var(--sky-1) 0%,#88d6f7 30%,var(--sky-2) 58%,var(--sky-3) 100%);
    box-shadow:0 0 80px rgba(20,90,140,.25);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- 天空装饰 ---------- */
  .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .sun{
    position:absolute;top:-120px;left:50%;width:420px;height:420px;
    transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,252,214,.55) 28%,rgba(255,255,255,0) 68%);
  }
  .cloud{
    position:absolute;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.5) 55%,rgba(255,255,255,0));
    filter:blur(1px);opacity:.85;
    animation:drift linear infinite;
  }
  .cloud.c1{width:220px;height:90px;top:16%;left:-40%;animation-duration:56s;}
  .cloud.c2{width:150px;height:64px;top:36%;left:-60%;animation-duration:72s;animation-delay:-18s;opacity:.6;}
  .cloud.c3{width:300px;height:110px;top:58%;left:-50%;animation-duration:90s;animation-delay:-40s;opacity:.5;}
  .cloud.c4{width:120px;height:52px;top:8%;left:-70%;animation-duration:64s;animation-delay:-30s;opacity:.65;}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(720px)}}

  .foliage{position:absolute;top:0;left:0;width:58%;max-width:300px;height:auto;pointer-events:none;z-index:1;opacity:.95;}
  .foliage-r{left:auto;right:0;transform:scaleX(-1);}

  .glints{position:absolute;inset:0;pointer-events:none;z-index:2;}
  .glints i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:0;animation:twinkle 4.5s ease-in-out infinite;}
  .glints i:nth-child(1){top:24%;left:18%;animation-delay:.4s;}
  .glints i:nth-child(2){top:32%;right:16%;animation-delay:1.6s;width:4px;height:4px;}
  .glints i:nth-child(3){top:52%;left:12%;animation-delay:2.6s;}
  .glints i:nth-child(4){top:60%;right:10%;animation-delay:3.4s;width:6px;height:6px;}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}

  /* ---------- 顶部 HUD ---------- */
  .hud{
    position:relative;z-index:6;
    display:flex;align-items:flex-start;gap:8px;
    padding:calc(12px + env(safe-area-inset-top)) 12px 0;
    flex:0 0 auto;
  }
  .hud-left{width:120px;flex:0 0 auto;display:flex;flex-direction:column;gap:7px;align-items:flex-start;}
  .level-chip{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px 4px;
    border-radius:999px;
    background:rgba(255,255,255,.28);
    border:2px solid rgba(255,255,255,.75);
    font-size:14px;font-weight:800;letter-spacing:.5px;
    text-shadow:0 2px 4px rgba(17,78,120,.5);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    white-space:nowrap;
  }
  .level-chip b{font-family:var(--num);font-size:16px;}
  .score-line{display:flex;align-items:baseline;gap:5px;text-shadow:0 2px 5px rgba(17,78,120,.55);}
  .score-label{font-size:12px;font-weight:700;opacity:.92;}
  .score-value{font-family:var(--num);font-size:21px;line-height:1;letter-spacing:.5px;}
  .score-value.bump{animation:bump .32s ease;}
  .star-row{position:relative;width:114px;display:flex;flex-direction:column;gap:3px;}
  .stars{display:flex;gap:5px;}
  .star-ico{width:17px;height:17px;transition:transform .3s,filter .3s;}
  .star-ico path{fill:rgba(255,255,255,.38);stroke:rgba(255,255,255,.85);stroke-width:1.8;paint-order:stroke fill;transition:fill .3s;}
  .star-ico.lit{transform:scale(1.18);filter:drop-shadow(0 0 6px rgba(255,210,63,.95));}
  .star-ico.lit path{fill:var(--gold);stroke:#fff6c9;}
  .star-track{height:5px;border-radius:99px;background:rgba(255,255,255,.32);overflow:hidden;box-shadow:inset 0 1px 2px rgba(20,70,110,.3);}
  .star-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffe98a,#ffb703);transition:width .5s cubic-bezier(.3,1,.4,1);box-shadow:0 0 8px rgba(255,200,40,.8);}

  .objectives{
    flex:1 1 auto;display:flex;justify-content:center;gap:14px;
    padding-top:20px;min-width:0;
  }
  .obj{position:relative;display:flex;justify-content:center;}
  .obj::before,.obj::after{
    content:"";position:absolute;top:-19px;width:2px;height:21px;
    background:linear-gradient(180deg,#7a4c21,#c99456);
    border-radius:2px;
  }
  .obj::before{left:13px;transform:rotate(4deg);}
  .obj::after{right:13px;transform:rotate(-4deg);}
  .obj-card{
    position:relative;width:54px;height:54px;border-radius:15px;
    background:linear-gradient(160deg,#ffe9bd,#e7b878 70%,#d9a563);
    border:3px solid #fff5dc;
    box-shadow:0 4px 0 rgba(146,93,41,.5),0 8px 14px rgba(20,65,105,.28);
    display:grid;place-items:center;
    animation:swing 4s ease-in-out infinite;
    transform-origin:50% -20px;
  }
  .obj:nth-child(2) .obj-card{animation-delay:-1.2s;}
  .obj-card svg{width:40px;height:40px;filter:drop-shadow(0 2px 2px rgba(120,70,20,.3));}
  .obj-count{
    position:absolute;right:-8px;bottom:-9px;
    min-width:24px;height:24px;padding:0 5px;
    border-radius:99px;
    background:linear-gradient(#ffb04a,#f27a2c);
    border:2.5px solid #fff8e0;
    color:#fff;font-family:var(--num);font-size:13px;line-height:19px;
    text-align:center;
    box-shadow:0 2px 4px rgba(120,60,10,.3);
  }
  .obj-count.done{background:linear-gradient(#9ee063,#4aa82a);}
  @keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

  .moves{width:66px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .moves-card{
    width:58px;height:60px;border-radius:16px;
    background:
      repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 3px,transparent 3px 9px),
      linear-gradient(160deg,#ffe8bd,#e8b877 70%,#dc9f5b);
    border:3px solid #fff5dc;
    box-shadow:0 4px 0 rgba(146,93,41,.5),0 8px 14px rgba(20,65,105,.28);
    display:grid;place-items:center;
    transform:rotate(2deg);
  }
  .moves-card span{
    font-family:var(--num);font-size:27px;color:#7c451a;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    line-height:1;
  }
  .moves-card span.bump{animation:bump .34s ease;}
  .moves-label{
    font-size:10.5px;font-weight:700;letter-spacing:1px;
    text-shadow:0 2px 4px rgba(17,78,120,.55);
    white-space:nowrap;
  }
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

  /* ---------- 棋盘 ---------- */
  .stage{
    position:relative;z-index:4;
    flex:1 1 auto;min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:10px 0 6px;
  }
  .board{
    position:relative;
    width:min(92vw,440px,calc((100dvh - 318px) * 8 / 7));
    aspect-ratio:8/7;
    max-width:100%;
    isolation:isolate;
    touch-action:none;
  }
  .board::before{
    content:"";position:absolute;inset:-6% -5%;
    background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.32),rgba(255,255,255,0) 66%);
    filter:blur(6px);z-index:-1;
  }
  .cells,.tiles,.fx{position:absolute;inset:0;}
  .cells{z-index:1;}
  .tiles{z-index:2;}
  .fx{pointer-events:none;z-index:6;}

  .cell-bg{
    position:absolute;width:12.5%;height:14.2857%;
    transform:translate3d(calc(var(--c) * 100%),calc(var(--r) * 100%),0);
  }
  .cell-bg::after{
    content:"";position:absolute;inset:2px;
    border-radius:10px;
    background:rgba(17,36,71,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.22),0 1px 2px rgba(42,96,132,.25);
  }

  .tile{
    position:absolute;width:12.5%;height:14.2857%;
    transform:translate3d(0,0,0);
    transition:transform .245s cubic-bezier(.32,.95,.45,1.14);
    will-change:transform;
    z-index:2;
  }
  .tile-inner{
    position:absolute;inset:2px;
    display:grid;place-items:center;
    transition:transform .18s ease,filter .18s ease;
  }
  .tile-inner::before{
    content:"";position:absolute;inset:8%;border-radius:50%;
    background:radial-gradient(circle at 50% 56%,var(--glow,rgba(255,255,255,.4)),transparent 68%);
    opacity:.42;filter:blur(2px);
  }
  .tile-inner svg{position:relative;width:94%;height:94%;animation:tileIn .26s ease both;filter:drop-shadow(0 3px 2px rgba(15,40,70,.4));}
  .tile[data-type="bear"]{--glow:#ffb46b;}
  .tile[data-type="fox"]{--glow:#ff9166;}
  .tile[data-type="frog"]{--glow:#a8e86a;}
  .tile[data-type="chicken"]{--glow:#ffe06a;}

  .tile.selected{z-index:5;}
  .tile.selected::after{
    content:"";position:absolute;inset:0;border-radius:11px;
    border:2.5px solid rgba(255,248,196,.95);
    box-shadow:0 0 12px rgba(255,220,90,.9),inset 0 0 10px rgba(255,238,160,.55);
    animation:selPulse 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes selPulse{0%,100%{opacity:.7}50%{opacity:1}}
  .tile.selected .tile-inner{transform:scale(1.16);filter:drop-shadow(0 0 10px rgba(255,244,180,.95)) drop-shadow(0 0 18px rgba(255,220,90,.6));}
  .tile.selected .tile-inner::before{opacity:.85;inset:2%;}

  .tile.hint .tile-inner{animation:hintPulse 1s ease-in-out infinite;}
  .tile.hint{z-index:4;}
  .tile.hint .tile-inner::before{opacity:.85;inset:0;background:radial-gradient(circle,rgba(255,246,180,.95),rgba(255,220,90,.2) 60%,transparent 72%);}

  .tile.pop{z-index:7;}
  .tile.pop .tile-inner{animation:popOut .27s ease-out forwards;}

  @keyframes tileIn{from{opacity:0}to{opacity:1}}
  @keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
  @keyframes popOut{
    0%{transform:scale(1);opacity:1}
    45%{transform:scale(1.26);opacity:1}
    100%{transform:scale(.05);opacity:0}
  }

  .burst{
    position:absolute;width:11%;height:12.57%;
    transform:translate(-50%,-50%);
  }
  .burst::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    border:3px solid rgba(255,247,196,.95);
    box-shadow:0 0 14px rgba(255,220,90,.85),inset 0 0 12px rgba(255,255,255,.7);
    animation:burst .48s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:scale(.3);opacity:1}
    100%{transform:scale(1.7);opacity:0}
  }
  .spark{
    position:absolute;width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle,#fffbe0,#ffd247);
    box-shadow:0 0 8px rgba(255,210,70,.95);
    transform:translate(-50%,-50%);
    animation:spark .6s ease-out forwards;
  }
  @keyframes spark{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15);opacity:0}
  }
  .score-pop{
    position:absolute;transform:translate(-50%,-50%);
    font-family:var(--num);font-size:21px;letter-spacing:.5px;
    color:#fff;white-space:nowrap;
    text-shadow:0 2px 0 #d68e18,0 0 10px rgba(255,214,90,.85),0 4px 10px rgba(20,50,80,.35);
    animation:scorePop 1s ease-out forwards;
  }
  @keyframes scorePop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
    22%{opacity:1;transform:translate(-50%,-76%) scale(1.18)}
    60%{opacity:1;transform:translate(-50%,-105%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-165%) scale(.95)}
  }

  /* ---------- 底部 ---------- */
  .footer{
    position:relative;z-index:5;flex:0 0 auto;
    height:104px;
  }
  .ground{
    position:absolute;left:0;right:0;bottom:0;height:64px;
    background:radial-gradient(120% 150% at 50% 100%,#86cf4f 0%,#63b83c 46%,#4b9c30 70%,rgba(75,156,48,0) 71%);
    filter:blur(.4px);
  }
  .ground::after{
    content:"";position:absolute;left:0;right:0;top:18px;height:26px;
    background:radial-gradient(60% 90% at 18% 60%,rgba(255,255,255,.22),transparent 70%),
               radial-gradient(50% 90% at 78% 50%,rgba(255,255,255,.18),transparent 70%);
  }
  .friend{
    position:absolute;bottom:-8px;width:25%;max-width:112px;
    animation:bob 3.2s ease-in-out infinite;
    pointer-events:none;
    filter:drop-shadow(0 8px 8px rgba(20,60,90,.25));
  }
  .friend svg{width:100%;height:auto;display:block;}
  .friend-l{left:2px;transform-origin:50% 100%;}
  .friend-r{right:2px;animation-delay:-1.4s;transform-origin:50% 100%;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

  .bubble{
    position:absolute;left:50%;bottom:74px;transform:translateX(-50%);
    width:max-content;max-width:74%;
    padding:8px 15px;
    border-radius:16px;
    background:rgba(255,252,240,.96);
    color:#6b431d;font-size:12.5px;font-weight:700;line-height:1.35;
    text-align:center;
    border:2px solid #fff;
    box-shadow:0 5px 12px rgba(20,60,90,.25);
    transition:opacity .35s,transform .35s;
    z-index:3;
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;
    background:rgba(255,252,240,.96);
    border-right:2px solid #fff;border-bottom:2px solid #fff;
    transform:translateX(-50%) rotate(45deg);
    border-radius:0 0 4px 0;
  }
  .bubble.hide{opacity:0;transform:translateX(-50%) translateY(8px);}

  .actions{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    display:flex;gap:10px;z-index:4;
  }
  .action-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:8px 15px;
    border-radius:999px;border:2.5px solid #fff;
    background:linear-gradient(#8ed9f9,#3aa9e0);
    color:#fff;font-family:var(--font);font-weight:800;font-size:13px;
    text-shadow:0 1px 2px rgba(15,75,110,.5);
    box-shadow:0 4px 0 #1d7bb4,0 7px 12px rgba(20,60,90,.28);
    cursor:pointer;
    transition:transform .12s,box-shadow .12s;
    touch-action:manipulation;
  }
  .action-btn svg{width:15px;height:15px;fill:currentColor;}
  .action-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d7bb4,0 3px 6px rgba(20,60,90,.25);}

  /* ---------- 提示 / 弹窗 ---------- */
  .toast{
    position:absolute;left:50%;bottom:126px;z-index:12;
    transform:translate(-50%,12px);
    padding:8px 16px;border-radius:999px;
    background:rgba(17,50,86,.8);
    color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.3px;
    white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .3s,transform .3s;
    box-shadow:0 6px 16px rgba(10,40,70,.35);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .overlay{
    position:absolute;inset:0;z-index:20;
    display:none;place-items:center;
    padding:26px;
    background:rgba(12,48,84,.42);
    -webkit-backdrop-filter:blur(5px);
    backdrop-filter:blur(5px);
  }
  .overlay.show{display:grid;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .modal{
    position:relative;z-index:2;
    width:min(320px,100%);
    padding:30px 20px 20px;
    border-radius:28px;
    background:linear-gradient(180deg,#fffdf6,#fff0d6);
    border:4px solid #fff;
    box-shadow:0 10px 0 rgba(176,116,52,.35),0 26px 50px rgba(12,45,80,.42);
    text-align:center;color:var(--ink);
    animation:modalIn .42s cubic-bezier(.2,1.35,.5,1);
  }
  @keyframes modalIn{from{transform:scale(.75) translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .modal-title{
    position:absolute;top:-19px;left:50%;transform:translateX(-50%);
    padding:6px 22px;border-radius:999px;
    background:linear-gradient(#a5ec72,#47ad2c);
    border:3px solid #fff;
    color:#fff;font-size:18px;font-weight:900;letter-spacing:1px;white-space:nowrap;
    text-shadow:0 2px 2px rgba(33,104,17,.6);
    box-shadow:0 4px 0 rgba(36,110,20,.55);
  }
  .modal-title.lose{background:linear-gradient(#ffb26b,#f07c3c);text-shadow:0 2px 2px rgba(150,62,10,.5);box-shadow:0 4px 0 rgba(150,62,10,.5);}
  .modal-stars{display:flex;justify-content:center;gap:6px;margin:8px 0 10px;height:58px;}
  .modal-stars svg{width:52px;height:52px;animation:starPop .45s cubic-bezier(.2,1.5,.4,1) both;}
  .modal-stars svg path{fill:#e5e0d4;stroke:#c9c0ad;stroke-width:1.6;}
  .modal-stars svg.on path{fill:#ffcc2f;stroke:#fff3b8;}
  .modal-stars svg.on{filter:drop-shadow(0 4px 8px rgba(240,175,20,.55));}
  @keyframes starPop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
  .modal-score{font-size:15px;font-weight:800;color:#a0672c;letter-spacing:.5px;}
  .modal-score b{font-family:var(--num);font-size:24px;color:#7c451a;margin-left:4px;vertical-align:-2px;}
  .modal-sub{font-size:13px;color:#a5754a;margin:8px 0 18px;line-height:1.5;}
  .modal-actions{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .btn{
    width:100%;padding:12px 20px;
    border-radius:999px;border:none;
    font-family:var(--font);font-size:16.5px;font-weight:900;letter-spacing:1px;
    cursor:pointer;touch-action:manipulation;
    transition:transform .12s,box-shadow .12s;
  }
  .btn.primary{
    background:linear-gradient(#aef077,#4cb62e 70%,#42a327);
    border:3px solid #fff;
    color:#fff;text-shadow:0 2px 2px rgba(31,100,15,.55);
    box-shadow:0 5px 0 #2c7e1d,0 10px 18px rgba(30,90,20,.3);
  }
  .btn.ghost{
    background:#fff7e6;
    border:2.5px solid rgba(196,146,86,.5);
    color:#a06a33;
    box-shadow:0 3px 0 rgba(190,140,80,.28);
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(50,110,25,.7);}

  .confetti{
    position:absolute;top:-24px;width:8px;height:14px;border-radius:3px;
    z-index:1;pointer-events:none;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0)}
    100%{transform:translateY(110vh) rotate(var(--rot,360deg));opacity:.65}
  }

  @media (max-height:700px){
    .footer{height:92px;}
    .friend{width:21%;}
    .bubble{display:none;}
    .obj-card{width:48px;height:48px;}
    .obj-card svg{width:36px;height:36px;}
    .moves-card{width:54px;height:56px;}
    .hud-left{width:112px;}
  }

  /* 平板 / 大屏：放大棋盘与 HUD */
  @media (min-width:700px) and (min-height:600px){

<script>
(function(){
  "use strict";

  const COLS = 8, ROWS = 7;
  const TYPES = ["bear","fox","frog","chicken"];

  const SVG_STAR = 'M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.5 6.2 20.55l1.1-6.5-4.7-4.6 6.5-.95z';

  const SPRITES = {
    bear: `<svg viewBox="6 2 108 108" aria-hidden="true">
      <circle cx="29" cy="31" r="16" fill="#8d4b24"/>
      <circle cx="91" cy="31" r="16" fill="#8d4b24"/>

      <path d="M60 81v4.5M60 85.5q-7 6-12.5 .5M60 85.5q7 6 12.5 .5" fill="none" stroke="#4a2a17" stroke-width="2.7" stroke-linecap="round"/>
      <ellipse cx="43" cy="62" rx="6.5" ry="7.5" fill="#3a2213"/>
      <ellipse cx="77" cy="62" rx="6.5" ry="7.5" fill="#3a2213"/>
      <circle cx="45.2" cy="59" r="2.5" fill="#fff"/>
      <circle cx="79.2" cy="59" r="2.5" fill="#fff"/>
      <ellipse cx="30" cy="77" rx="7.4" ry="4.8" fill="#ef9a7e" opacity=".55"/>
      <ellipse cx="90" cy="77" rx="7.4" ry="4.8" fill="#ef9a7e" opacity=".55"/>
      <ellipse cx="41" cy="43" rx="16" ry="9" fill="#fff" opacity=".18" transform="rotate(-20 41 43)"/>
    </svg>`,

    fox: `<svg viewBox="6 2 108 108" aria-hidden="true">
      <path d="M22 44 L12 10 L50 28 Z" fill="#ef5b2f"/>
      <path d="M98 44 L108 10 L70 28 Z" fill="#ef5b2f"/>
      <path d="M24 37 L18 19 L39 27 Z" fill="#ffd9c8"/>
      <path d="M96 37 L102 19 L81 27 Z" fill="#ffd9c8"/>
      <ellipse cx="60" cy="68" rx="43" ry="36" fill="#f2603a"/>
      <ellipse cx="46" cy="84" rx="18" ry="13" fill="#fff2e4"/>
      <ellipse cx="74" cy="84" rx="18" ry="13" fill="#fff2e4"/>
      <ellipse cx="60" cy="88" rx="7" ry="5.4" fill="#3d2418"/>
      <path d="M60 93v3.5M60 96.5q-6 5.5-10.5 1M60 96.5q6 5.5 10.5 1" fill="none" stroke="#3d2418" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="43" cy="62" rx="6.3" ry="7.4" fill="#3d2418"/>
      <ellipse cx="77" cy="62" rx="6.3" ry="7.4" fill="#3d2418"/>
      <circle cx="45" cy="59" r="2.4" fill="#fff"/>
      <circle cx="79" cy="59" r="2.4" fill="#fff"/>
      <ellipse cx="27" cy="74" rx="7" ry="4.6" fill="#ff9a86" opacity=".55"/>
      <ellipse cx="93" cy="74" rx="7" ry="4.6" fill="#ff9a86" opacity=".55"/>
      <ellipse cx="40" cy="44" rx="15" ry="8" fill="#fff" opacity=".18" transform="rotate(-20 40 44)"/>
    </svg>`,

    frog: `<svg viewBox="6 2 108 108" aria-hidden="true">
      <circle cx="33" cy="37" r="21" fill="#77cf50"/>
      <circle cx="87" cy="37" r="21" fill="#77cf50"/>
      <ellipse cx="60" cy="72" rx="41" ry="34" fill="#6fce4b"/>
      <circle cx="33" cy="38" r="13" fill="#fff"/>
      <circle cx="87" cy="38" r="13" fill="#fff"/>
      <circle cx="34.5" cy="40" r="6.6" fill="#2f3d24"/>
      <circle cx="85.5" cy="40" r="6.6" fill="#2f3d24"/>
      <circle cx="36.5" cy="37" r="2.2" fill="#fff"/>
      <circle cx="87.5" cy="37" r="2.2" fill="#fff"/>
      <circle cx="53" cy="68" r="1.9" fill="#4c8a30"/>
      <circle cx="67" cy="68" r="1.9" fill="#4c8a30"/>
      <path d="M32 82q28 20 56 0" fill="none" stroke="#3d6b28" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="25" cy="87" rx="6.4" ry="4.4" fill="#ffb1a0" opacity=".55"/>
      <ellipse cx="95" cy="87" rx="6.4" ry="4.4" fill="#ffb1a0" opacity=".55"/>
      <ellipse cx="42" cy="52" rx="13" ry="7" fill="#fff" opacity=".16" transform="rotate(-15 42 52)"/>
    </svg>`,

    chicken: `<svg viewBox="6 2 108 108" aria-hidden="true">
      <circle cx="47" cy="24" r="9" fill="#f04438"/>
      <circle cx="60" cy="15" r="10.5" fill="#f04438"/>
      <circle cx="73" cy="24" r="9" fill="#f04438"/>
      <ellipse cx="60" cy="68" rx="42" ry="37" fill="#ffd43b"/>
      <path d="M47 78q13-8 26 0-13 18-26 0Z" fill="#ff912d"/>
      <path d="M51 80q9 6 18 0" stroke="#e2731a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="44" cy="61" r="6.4" fill="#4a3315"/>
      <circle cx="76" cy="61" r="6.4" fill="#4a3315"/>
      <circle cx="46" cy="58" r="2.3" fill="#fff"/>
      <circle cx="78" cy="58" r="2.3" fill="#fff"/>
      <ellipse cx="28" cy="76" rx="7" ry="4.8" fill="#ff9d7a" opacity=".5"/>
      <ellipse cx="92" cy="76" rx="7" ry="4.8" fill="#ff9d7a" opacity=".5"/>
      <ellipse cx="42" cy="45" rx="15" ry="8" fill="#fff" opacity=".2" transform="rotate(-18 42 45)"/>
    </svg>`
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const boardEl = $("#board");
  const cellsLayer = $(".cells", boardEl);
  const tilesLayer = $(".tiles", boardEl);
  const fxLayer = $(".fx", boardEl);

  const scoreEl = $("#scoreVal");
  const movesEl = $("#movesVal");
  const levelEl = $("#levelNum");
  const starFill = $("#starFill");
  const starIcons = Array.from(document.querySelectorAll(".star-ico"));
  const objWrap = $("#objectives");
  const overlay = $("#overlay");
  const modalTitle = $("#modalTitle");
  const modalStars = $("#modalStars");
  const modalScore = $("#modalScore");
  const modalSub = $("#modalSub");
  const modalPrimary = $("#modalPrimary");
  const modalSecondary = $("#modalSecondary");
  const toastEl = $("#toast");
  const bubble = $("#bubble");

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rnd = n => Math.floor(Math.random() * n);

  let grid = [];
  let score = 0, moves = 0, level = 1;
  let targets = [], thresholds = [1000, 2200, 3600];
  let busy = false, over = false, lastWin = false;
  let selected = null, drag = null;
  let idleTimer = null, hintTimer = null, toastTimer = null;

  /* ---------------- 静态格子 ---------------- */
  (function buildCells(){
    const frag = document.createDocumentFragment();
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        const d = document.createElement("div");
        d.className = "cell-bg";
        d.style.setProperty("--r", r);
        d.style.setProperty("--c", c);
        frag.appendChild(d);
      }
    }
    cellsLayer.appendChild(frag);
  })();

  /* ---------------- 棋子 ---------------- */
  function createTile(type, r, c, spawnRow){
    const el = document.createElement("div");
    el.className = "tile";
    el.dataset.type = type;
    el.dataset.r = r;
    el.dataset.c = c;
    el.innerHTML = `<div class="tile-inner">${SPRITES[type]}</div>`;
    const sr = (spawnRow === undefined || spawnRow === null) ? r : spawnRow;
    el.style.transform = `translate3d(${c * 100}%, ${sr * 100}%, 0)`;
    tilesLayer.appendChild(el);
    return { type, el };
  }

  function moveTile(tile, r, c){
    tile.el.dataset.r = r;
    tile.el.dataset.c = c;
    tile.el.style.transform = `translate3d(${c * 100}%, ${r * 100}%, 0)`;
  }

  function pickSafeType(r, c){
    let type = TYPES[rnd(4)];
    let guard = 0;
    while (guard++ < 60){
      const l1 = c >= 1 ? grid[r][c-1] : null;
      const l2 = c >= 2 ? grid[r][c-2] : null;
      const u1 = r >= 1 ? grid[r-1][c] : null;
      const u2 = r >= 2 ? grid[r-2][c] : null;
      const badH = l1 && l2 && l1.type === type && l2.type === type;
      const badV = u1 && u2 && u1.type === type && u2.type === type;
      if (!badH && !badV) break;
      type = TYPES[rnd(4)];
    }
    return type;
  }

  function buildBoard(){
    for (let attempt = 0; attempt < 10; attempt++){
      tilesLayer.innerHTML = "";
      grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
      for (let r = 0; r < ROWS; r++){
        for (let c = 0; c < COLS; c++){
          grid[r][c] = createTile(pickSafeType(r, c), r, c);
        }
      }
      if (findMove()) return;
    }
  }

  /* ---------------- 匹配检测 ---------------- */
  function findRuns(){
    const runs = [];
    for (let r = 0; r < ROWS; r++){
      let c = 0;
      while (c < COLS){
        const t = grid[r][c];
        if (!t){ c++; continue; }
        let e = c;
        while (e + 1 < COLS && grid[r][e+1] && grid[r][e+1].type === t.type) e++;
        if (e - c + 1 >= 3){
          const cells = [];
          for (let i = c; i <= e; i++) cells.push({r, c: i});
          runs.push({type: t.type, len: e - c + 1, dir: "h", cells});
        }
        c = e + 1;
      }
    }
    for (let c = 0; c < COLS; c++){
      let r = 0;
      while (r < ROWS){
        const t = grid[r][c];
        if (!t){ r++; continue; }
        let e = r;
        while (e + 1 < ROWS && grid[e+1][c] && grid[e+1][c].type === t.type) e++;
        if (e - r + 1 >= 3){
          const cells = [];
          for (let i = r; i <= e; i++) cells.push({r: i, c});
          runs.push({type: t.type, len: e - r + 1, dir: "v", cells});
        }
        r = e + 1;
      }
    }
    return runs;
  }

  function hasRunOn(g){
    for (let r = 0; r < ROWS; r++){
      let run = 0;
      for (let c = 0; c < COLS; c++){
        if (g[r][c] && c > 0 && g[r][c] === g[r][c-1]) run++;
        else run = g[r][c] ? 1 : 0;
        if (run >= 3) return true;
      }
    }
    for (let c = 0; c < COLS; c++){
      let run = 0;
      for (let r = 0; r < ROWS; r++){
        if (g[r][c] && r > 0 && g[r][c] === g[r-1][c]) run++;
        else run = g[r][c] ? 1 : 0;
        if (run >= 3) return true;
      }
    }
    return false;
  }

  function findMove(){
    const g = grid.map(row => row.map(t => t ? t.type : null));
    const swap = (a, b) => { const tmp = g[a.r][a.c]; g[a.r][a.c] = g[b.r][b.c]; g[b.r][b.c] = tmp; };
    for (let r = 0; r < ROWS; r++){
      for (let c = 0; c < COLS; c++){
        if (!g[r][c]) continue;
        if (c + 1 < COLS && g[r][c+1]){
          const a = {r, c}, b = {r, c: c+1};
          swap(a, b);
          const ok = hasRunOn(g);
          swap(a, b);
          if (ok) return [a, b];
        }
        if (r + 1 < ROWS && g[r+1][c]){
          const a = {r, c}, b = {r: r+1, c};
          swap(a, b);
          const ok = hasRunOn(g);
          swap(a, b);
          if (ok) return [a, b];
        }
      }
    }
    return null;
  }

  /* ---------------- 特效 ---------------- */
  function posStyle(r, c){
    return {
      left: ((c + 0.5) / COLS * 100) + "%",
      top: ((r + 0.5) / ROWS * 100) + "%"
    };
  }

  function addBurst(r, c){
    const d = document.createElement("div");
    d.className = "burst";
    const p = posStyle(r, c);
    d.style.left = p.left;
    d.style.top = p.top;
    fxLayer.appendChild(d);
    setTimeout(() => d.remove(), 520);
  }

  function addSparks(r, c, count){
    for (let i = 0; i < count; i++){
      const s = document.createElement("div");
      s.className = "spark";
      const p = posStyle(r, c);
      s.style.left = p.left;
      s.style.top = p.top;
      const ang = Math.random() * Math.PI * 2;
      const dist = 16 + Math.random() * 28;
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      fxLayer.appendChild(s);
      setTimeout(() => s.remove(), 640);
    }
  }

  function addScorePop(r, c, text){
    const d = document.createElement("div");
    d.className = "score-pop";
    d.textContent = text;
    const p = posStyle(r, c);
    d.style.left = p.left;
    d.style.top = p.top;
    fxLayer.appendChild(d);
    setTimeout(() => d.remove(), 1050);
  }

  /* ---------------- 填坑 ---------------- */
  async function collapse(){
    const fresh = [];
    for (let c = 0; c < COLS; c++){
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--){
        const t = grid[r][c];
        if (t){
          if (write !== r){
            grid[write][c] = t;
            grid[r][c] = null;
            moveTile(t, write, c);
          }
          write--;
        }
      }
      const count = write + 1;
      for (let r = write; r >= 0; r--){
        const t = createTile(TYPES[rnd(4)], r, c, r - count);
        grid[r][c] = t;
        fresh.push({tile: t, r, c});
      }
    }
    if (fresh.length){
      fresh.forEach(({tile}) => { void tile.el.offsetWidth; });
      fresh.forEach(({tile, r, c}) => moveTile(tile, r, c));
    }
    await sleep(370);
  }

  /* ---------------- 消除主循环 ---------------- */
  async function resolveAll(){
    let chain = 0;
    while (chain < 20){
      const runs = findRuns();
      if (!runs.length) break;
      chain++;

      const uniq = new Map();
      runs.forEach(run => {
        run.cells.forEach(({r, c}) => {
          const t = grid[r][c];
          if (t) uniq.set(r + "," + c, {r, c, tile: t});
        });
      });
      if (!uniq.size) break;

      let gained = uniq.size * 30;
      gained += Math.round(uniq.size * 30 * (chain - 1) * 0.5);
      gained += runs.filter(x => x.len >= 4).length * 40;
      score += gained;

      let sumR = 0, sumC = 0;
      uniq.forEach(({r, c, tile}) => {
        sumR += r; sumC += c;
        targets.forEach(t => { if (t.type === tile.type) t.got = Math.min(t.need, t.got + 1); });
        addBurst(r, c);
        tile.el.classList.add("pop");
      });

      runs.forEach(run => {
        const mid = run.cells[Math.floor(run.cells.length / 2)];
        addSparks(mid.r, mid.c, 4);
      });

      const avgR = sumR / uniq.size, avgC = sumC / uniq.size;
      addScorePop(avgR, avgC, "+" + gained);
      updateHud(true);

      await sleep(250);

      uniq.forEach(({r, c, tile}) => {
        tile.el.remove();
        if (grid[r][c] === tile) grid[r][c] = null;
      });

      await collapse();
      updateHud();
      await sleep(40);
    }
    await sleep(120);
  }

  /* ---------------- 交换 ---------------- */
  function swapCells(a, b){
    const ta = grid[a.r][a.c];
    const tb = grid[b.r][b.c];
    grid[a.r][a.c] = tb;
    grid[b.r][b.c] = ta;
    if (ta) moveTile(ta, b.r, b.c);
    if (tb) moveTile(tb, a.r, a.c);
  }

  function adjacent(a, b){
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  }

  async function trySwap(a, b){
    if (busy || over || !adjacent(a, b)) return;
    const ta = grid[a.r] && grid[a.r][a.c];
    const tb = grid[b.r] && grid[b.r][b.c];
    if (!ta || !tb) return;

    busy = true;
    clearSelection();
    hideHint();
    hideBubble();

    swapCells(a, b);
    await sleep(250);

    if (!findRuns().length){
      swapCells(a, b);
      await sleep(250);
      busy = false;
      resetIdle();
      return;
    }

    moves = Math.max(0, moves - 1);
    updateHud(true);
    await resolveAll();

    const win = targets.every(t => t.got >= t.need);
    if (win){
      over = true;
      busy = false;
      await sleep(250);
      showWin();
      return;
    }
    if (moves <= 0){
      over = true;
      busy = false;
      await sleep(250);
      showLose();
      return;
    }

    if (!findMove()){
      await reshuffle();
    }
    busy = false;
    resetIdle();
  }

  /* ---------------- 洗牌 ---------------- */
  async function reshuffle(){
    showToast("没有可消除的组合啦，重新洗牌～");
    selected = null;
    tilesLayer.style.transition = "opacity .25s";
    tilesLayer.style.opacity = "0";
    await sleep(260);
    buildBoard();
    tilesLayer.style.opacity = "1";
    await sleep(120);
    tilesLayer.style.transition = "";
  }

  /* ---------------- 界面 ---------------- */
  function renderObjectives(){
    objWrap.innerHTML = "";
    targets.forEach(t => {
      const d = document.createElement("div");
      d.className = "obj";
      d.innerHTML = `<div class="obj-card">${SPRITES[t.type]}<span class="obj-count">${t.need - t.got}</span></div>`;
      objWrap.appendChild(d);
      t.el = d.querySelector(".obj-count");
    });
  }

  function updateHud(pulse){
    scoreEl.textContent = score.toLocaleString("en-US");
    movesEl.textContent = moves;
    targets.forEach(t => {
      const left = Math.max(0, t.need - t.got);
      if (t.el){
        t.el.textContent = left;
        t.el.classList.toggle("done", left === 0);
      }
    });
    const ratio = Math.min(1, score / thresholds[2]);
    starFill.style.width = (ratio * 100).toFixed(1) + "%";
    starIcons.forEach((el, i) => el.classList.toggle("lit", score >= thresholds[i]));
    if (pulse){
      movesEl.classList.remove("bump");
      void movesEl.offsetWidth;
      movesEl.classList.add("bump");
    }
  }

  function setupLevel(lv){
    level = lv;
    score = 0;
    over = false;
    busy = false;
    selected = null;
    lastWin = false;
    grid = [];

    moves = 24 + Math.floor((lv - 1) / 2) * 2;
    targets = [TYPES[(lv + 2) % 4], TYPES[(lv + 1) % 4]].map(type => ({
      type,
      need: 12 + lv * 3,
      got: 0,
      el: null
    }));
    thresholds = [1000, 2200, 3600].map(v => Math.round(v * (1 + (lv - 1) * 0.18) / 50) * 50);

    levelEl.textContent = lv;
    overlay.classList.remove("show");
    overlay.querySelectorAll(".confetti").forEach(el => el.remove());
    hideHint();
    clearSelection();
    bubble.classList.remove("hide");
    renderObjectives();
    buildBoard();
    updateHud();
    resetIdle();
  }

  /* ---------------- 提示 / 气泡 ---------------- */
  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1900);
  }

  function hideBubble(){
    bubble.classList.add("hide");
  }

  function showHint(){
    if (busy || over) return;
    const mv = findMove();
    if (!mv) return;
    hideHint();
    mv.forEach(cell => {
      const t = grid[cell.r] && grid[cell.r][cell.c];
      if (t) t.el.classList.add("hint");
    });
    hideBubble();
    clearTimeout(hintTimer);
    hintTimer = setTimeout(hideHint, 2600);
  }

  function hideHint(){
    clearTimeout(hintTimer);
    tilesLayer.querySelectorAll(".tile.hint").forEach(el => el.classList.remove("hint"));
  }

  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!busy && !over) showHint();
    }, 7000);
  }

  /* ---------------- 选择 ---------------- */
  function clearSelection(){
    if (!selected) return;
    const t = grid[selected.r] && grid[selected.r][selected.c];
    if (t) t.el.classList.remove("selected");
    selected = null;
  }

  function selectCell(cell){
    clearSelection();
    const t = grid[cell.r] && grid[cell.r][cell.c];
    if (!t) return;
    selected = cell;
    t.el.classList.add("selected");
  }

  /* ---------------- 输入 ---------------- */
  function cellOf(el){
    return { r: Number(el.dataset.r), c: Number(el.dataset.c) };
  }

  tilesLayer.addEventListener("pointerdown", e => {
    if (busy || over) return;
    const el = e.target.closest(".tile");
    if (!el) return;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, cell: cellOf(el), id: e.pointerId };
  });

  window.addEventListener("pointerup", e => {
    if (!drag) return;
    const start = drag;
    drag = null;
    if (busy || over) return;

    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;

    if (Math.hypot(dx, dy) > 24){
      let target = null;
      if (Math.abs(dx) > Math.abs(dy)){
        target = { r: start.cell.r, c: start.cell.c + (dx > 0 ? 1 : -1) };
      } else {
        target = { r: start.cell.r + (dy > 0 ? 1 : -1), c: start.cell.c };
      }
      if (target.r >= 0 && target.r < ROWS && target.c >= 0 && target.c < COLS){
        trySwap(start.cell, target);
      }
      return;
    }

    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const hitEl = hit && hit.closest ? hit.closest(".tile") : null;
    if (hitEl){
      const hitCell = cellOf(hitEl);
      const isSame = hitCell.r === start.cell.r && hitCell.c === start.cell.c;
      if (!isSame && adjacent(start.cell, hitCell)){
        trySwap(start.cell, hitCell);
        return;
      }
    }

    if (!selected){
      selectCell(start.cell);
      return;
    }
    if (selected.r === start.cell.r && selected.c === start.cell.c){
      clearSelection();
      return;
    }
    if (adjacent(selected, start.cell)){
      trySwap(selected, start.cell);
      return;
    }
    selectCell(start.cell);
  });

  window.addEventListener("pointercancel", () => { drag = null; });

  /* ---------------- 结算弹窗 ---------------- */
  function starMarkup(on){
    return `<svg viewBox="0 0 24 24" class="${on ? "on" : ""}"><path d="${SVG_STAR}"/></svg>`;
  }

  function burstConfetti(){
    const colors = ["#ffd23f","#ff7a59","#6fce4b","#5bc8f5","#ff9ecb","#fff3b8"];
    for (let i = 0; i < 26; i++){
      const d = document.createElement("i");
      d.className = "confetti";
      d.style.left = Math.random() * 100 + "%";
      d.style.background = colors[rnd(colors.length)];
      d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";
      d.style.animationDuration = (1.4 + Math.random() * 0.9).toFixed(2) + "s";
      d.style.setProperty("--rot", Math.round(Math.random() * 720 - 360) + "deg");
      overlay.appendChild(d);
      setTimeout(() => d.remove(), 2800);
    }
  }

  function showWin(){
    lastWin = true;
    const earned = score >= thresholds[2] ? 3 : score >= thresholds[1] ? 2 : 1;
    modalTitle.textContent = "闯关成功！";
    modalTitle.classList.remove("lose");
    modalStars.innerHTML = [0,1,2].map(i => starMarkup(i < earned)).join("");
    Array.from(modalStars.children).forEach((svg, i) => {
      svg.style.animationDelay = (0.08 + i * 0.13) + "s";
    });
    modalScore.textContent = score.toLocaleString("en-US");
    modalSub.textContent = earned === 3 ? "太棒了，完美通关！" : earned === 2 ? "表现出色，继续加油！" : "顺利过关，再接再厉！";
    modalPrimary.textContent = "下一关";
    modalSecondary.textContent = "重玩本关";
    modalSecondary.style.display = "";
    overlay.classList.add("show");
    burstConfetti();
  }

  function showLose(){
    lastWin = false;
    modalTitle.textContent = "步数用完啦";
    modalTitle.classList.add("lose");
    modalStars.innerHTML = [0,1,2].map(() => starMarkup(false)).join("");
    modalScore.textContent = score.toLocaleString("en-US");
    modalSub.textContent = "目标只差一点点，再试一次一定能过！";
    modalPrimary.textContent = "再试一次";
    modalSecondary.style.display = "none";
    overlay.classList.add("show");
  }

  modalPrimary.addEventListener("click", () => {
    overlay.classList.remove("show");
    setupLevel(lastWin ? level + 1 : level);
  });

  modalSecondary.addEventListener("click", () => {
    overlay.classList.remove("show");
    setupLevel(level);
  });

  $("#hintBtn").addEventListener("click", () => { showHint(); });

  $("#restartBtn").addEventListener("click", () => {
    if (busy) return;
    overlay.classList.remove("show");
    setupLevel(level);
  });

  /* ---------------- 底部伙伴 ---------------- */
  $("#friendL").innerHTML = SPRITES.bear;
  $("#friendR").innerHTML = SPRITES.fox;

  /* ---------------- 启动 ---------------- */
  setupLevel(1);
})();
</script>
</body>
</html>
